<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walletconnect</title>
  <meta name="description" content="Walletconnect connection alert notice" />
  <!-- Pure Vanilla CSS without any frameworks or external libraries -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Ambient background depth layer extracted from original design -->
  <div class="bg-layer" aria-hidden="true"></div>

  <!-- Main Viewport Centered Container -->
  <main class="page-container">
    
    <!-- Brand Header: [Logo alt/broken icon replica] Walletconnect -->
    <header class="brand-header">
      <div class="logo-box" id="logoBox" title="Click to toggle screenshot replica / official logo">
        
        <!-- Screenshot replica: exact browser broken image icon with alt text 'Logo' -->
        <span class="broken-logo-view" id="brokenLogoView">
          <svg class="broken-icon-svg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="#ffffff" stroke-width="1.3"/>
            <path d="M4 11.5L7 7.5L9.5 10.5L11 9L13 11.5H3" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round"/>
            <circle cx="5" cy="5" r="1.2" fill="#ffffff"/>
            <path d="M8 1.5L9.5 5.5L7.5 9.5L9 14.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
          </svg>
          <span class="broken-alt-text">Logo</span>
        </span>

        <!-- Alternative view: Loaded WalletConnect official logo -->
        <span class="loaded-logo-view" id="loadedLogoView">
          <img src="image/logo.png" alt="WalletConnect Logo" class="loaded-logo-img" />
        </span>

      </div>

      <!-- Text: 'Walletconnect' -->
      <h1 class="brand-title">Walletconnect</h1>
    </header>

    <!-- Error Alert Card -->
    <section class="error-card" id="errorCard" tabindex="0" role="alert" aria-live="polite" title="Click to test retry">
      <div class="error-icon-wrapper" aria-hidden="true">
        <!-- Rotated diamond with exclamation mark -->
        <svg class="warning-diamond-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="12" y="2.2" width="13.8" height="13.8" rx="2.5" transform="rotate(45 12 2.2)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
          <line x1="12" y1="8" x2="12" y2="12.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="15.8" r="1.1" fill="#ffffff"/>
        </svg>
      </div>

      <div class="error-message" id="errorMessage">
        Error Connecting..Pls revert to your support.
      </div>
    </section>

  </main>

  <!-- Interactive Utility Bar -->
  <aside class="utility-bar" aria-label="Page controls">
    <button type="button" class="utility-btn" id="btnRetry">Simulate Retry</button>
    <button type="button" class="utility-btn" id="btnToggleLogo">Toggle Logo</button>
    <button type="button" class="utility-btn" id="btnCopy">Copy Text</button>
  </aside>

  <!-- Feedback Toast Notification -->
  <div class="toast-notice" id="toastNotice" role="status"></div>

  <!-- Pure Vanilla JavaScript without any frameworks or external libraries -->
  <script src="js/script.js"></script>
</body>
</html>
